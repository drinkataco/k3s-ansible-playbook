---

- name: 'Check for cached kernel .deb on controller'
  find:
    paths: '{{ kernel_local_cache_dir }}'
    patterns: 'linux-image-*{{ kernel_local_version }}*.deb'
  register: cached_kernel_deb
  delegate_to: localhost
  become: false

- name: 'Check for cached kernel hash on controller'
  stat:
    path: '{{ kernel_local_cache_dir }}/.kernel_hash_{{ kernel_local_version }}'
  register: cached_hash_stat
  delegate_to: localhost
  become: false

- name: 'Check for existing .deb on build host (e.g. previous interrupted run)'
  find:
    paths: '{{ kernel_build_dir }}'
    patterns: 'linux-image-*{{ kernel_local_version }}*.deb'
  register: build_host_deb

- name: 'Determine if build and/or fetch are needed'
  set_fact:
    kernel_build_needed: "{{ cached_kernel_deb.matched == 0 and build_host_deb.matched == 0 }}"
    kernel_fetch_needed: "{{ cached_kernel_deb.matched == 0 or not cached_hash_stat.stat.exists }}"

- name: 'Kernel cache is current — skipping build and fetch'
  debug:
    msg: 'Cached .deb and hash already exist for {{ kernel_local_version }}'
  when: not kernel_build_needed | bool and not kernel_fetch_needed | bool

- name: 'Build host has existing .deb — skipping build, will fetch'
  debug:
    msg: 'Found existing .deb on build host from a previous run — skipping compilation'
  when: not kernel_build_needed | bool and kernel_fetch_needed | bool

- name: 'Install kernel build dependencies'
  package:
    name:
      - bc
      - bison
      - cpio
      - debhelper
      - flex
      - git
      - kmod
      - libdw-dev
      - libelf-dev
      - libncurses-dev
      - libssl-dev
      - make
      - python3
      - rsync
    state: present
  when: kernel_build_needed | bool

- name: 'Create build directory'
  file:
    path: '{{ kernel_build_dir }}'
    state: directory
    mode: '0755'
  when: kernel_build_needed | bool

- name: 'Remove stale .deb packages from build directory'
  ansible.builtin.find:
    paths: '{{ kernel_build_dir }}'
    patterns: '*.deb'
  register: stale_debs
  when: kernel_build_needed | bool

- name: 'Delete stale .deb packages from build directory'
  ansible.builtin.file:
    path: '{{ item.path }}'
    state: absent
  loop: '{{ stale_debs.files }}'
  when: kernel_build_needed | bool

- name: 'Clone RPi kernel source (shallow)'
  git:
    repo: '{{ kernel_source_repo }}'
    dest: '{{ kernel_build_dir }}/linux'
    version: '{{ kernel_source_branch }}'
    depth: 1
    single_branch: true
  when: kernel_build_needed | bool

- name: 'Suppress git dirty marker in kernel version string'
  file:
    path: '{{ kernel_build_dir }}/linux/.scmversion'
    state: touch
    modification_time: preserve
    access_time: preserve
  when: kernel_build_needed | bool

- name: 'Apply base defconfig'
  command: 'make {{ kernel_defconfig }}'
  args:
    chdir: '{{ kernel_build_dir }}/linux'
  when: kernel_build_needed | bool

- name: 'Apply kernel config overrides'
  shell: './scripts/config {{ kernel_config_args }}'
  args:
    chdir: '{{ kernel_build_dir }}/linux'
  when: kernel_build_needed | bool

- name: 'Resolve config dependencies'
  command: 'make olddefconfig'
  args:
    chdir: '{{ kernel_build_dir }}/linux'
  when: kernel_build_needed | bool

- name: 'Build kernel (~50 minutes on Pi 5)'
  command: 'make -j{{ ansible_processor_vcpus | default(4) }} bindeb-pkg LOCALVERSION={{ kernel_local_version }}'
  args:
    chdir: '{{ kernel_build_dir }}/linux'
  when: kernel_build_needed | bool
  async: 10800
  poll: 30

- name: 'Find .deb packages on build host'
  find:
    paths: '{{ kernel_build_dir }}'
    patterns: '*.deb'
  register: built_debs
  when: kernel_fetch_needed | bool

- name: 'Create local kernel cache directory on controller'
  file:
    path: '{{ kernel_local_cache_dir }}'
    state: directory
    mode: '0755'
  delegate_to: localhost
  become: false

- name: 'Fetch .deb packages to controller'
  fetch:
    src: '{{ item.path }}'
    dest: '{{ kernel_local_cache_dir }}/'
    flat: true
  loop: '{{ built_debs.files }}'
  when: kernel_fetch_needed | bool

- name: 'Find linux-image .deb in local cache'
  find:
    paths: '{{ kernel_local_cache_dir }}'
    patterns: 'linux-image-*{{ kernel_local_version }}*.deb'
  register: cached_image_deb
  delegate_to: localhost
  become: false
  when: kernel_fetch_needed | bool

- name: 'Compute hash of linux-image .deb'
  stat:
    path: '{{ (cached_image_deb.files | first).path }}'
    checksum_algorithm: sha256
    get_checksum: true
  register: kernel_deb_stat
  delegate_to: localhost
  become: false
  when: kernel_fetch_needed | bool and cached_image_deb.matched > 0

- name: 'Write build hash to cache'
  copy:
    content: '{{ kernel_deb_stat.stat.checksum }}'
    dest: '{{ kernel_local_cache_dir }}/.kernel_hash_{{ kernel_local_version }}'
  delegate_to: localhost
  become: false
  when: kernel_fetch_needed | bool and cached_image_deb.matched > 0
