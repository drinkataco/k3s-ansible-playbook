---

- name: 'Check legacy cmdline path'
  stat:
    path: '/boot/cmdline.txt'
  register: legacy_cmdline

- name: 'Check new firmware cmdline path'
  stat:
    path: '/boot/firmware/cmdline.txt'
  register: firmware_cmdline

- name: 'Assert Raspberry Pi cmdline path exists'
  assert:
    that:
      - legacy_cmdline.stat.exists or firmware_cmdline.stat.exists
    fail_msg: 'Neither /boot/cmdline.txt nor /boot/firmware/cmdline.txt exists'

- name: 'Set cmdline path'
  set_fact:
    rpi_cmdline_path: "{{ '/boot/firmware/cmdline.txt' if firmware_cmdline.stat.exists else '/boot/cmdline.txt' }}"

- name: 'Activating cgroup support'
  lineinfile:
    path: '{{ rpi_cmdline_path }}'
    regexp: '^((?!.*\bcgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory\b).*)$'
    line: '\1 cgroup_enable=cpuset cgroup_memory=1 cgroup_enable=memory'
    backrefs: true
  notify: 'reboot'

- name: 'Install iptables for K3s prerequisites'
  package:
    name: 'iptables'
    state: 'present'

- name: 'Collect running services'
  service_facts:

- name: 'Disable off Swap for Kubernetes'
  command: 'swapoff -a'
  when: ansible_swaptotal_mb | int > 0
  changed_when: true

- name: 'Disable swap entries in fstab'
  replace:
    path: '/etc/fstab'
    regexp: '^(\s*[^#\n]+\s+\S+\s+swap\s+.*)$'
    replace: '# \1'

- name: 'Disable swap services when present'
  systemd:
    name: '{{ item }}'
    enabled: false
    state: stopped
  loop:
    - 'dphys-swapfile.service'
    - 'zramswap.service'
    - 'zram-config.service'
    - 'systemd-swap.service'
    - 'dev-zram0.swap'
    - 'rpi-zram-writeback.service'
    - 'rpi-zram-writeback.timer'
  when: item in ansible_facts.services

- name: 'Check if rpi-swap is installed (Trixie+)'
  stat:
    path: '/etc/rpi/swap.conf'
  register: rpi_swap_conf

- name: 'Create rpi-swap drop-in directory (Trixie+)'
  file:
    path: '/etc/rpi/swap.conf.d'
    state: directory
    owner: root
    group: root
    mode: '0755'
  when: rpi_swap_conf.stat.exists

- name: 'Disable swap via rpi-swap config (Trixie+)'
  copy:
    content: |
      [Main]
      Mechanism=none
    dest: '/etc/rpi/swap.conf.d/99-disable-swap.conf'
    owner: root
    group: root
    mode: '0644'
  when: rpi_swap_conf.stat.exists
