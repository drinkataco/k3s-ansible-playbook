---

# Builds run sequentially on the build host — two concurrent kernel builds
# would contend for the same cores and risk OOM.

- name: 'Build Pi 4 kernel'
  hosts: 'pi4_kernel_builder'
  remote_user: '{{ ansible_user }}'
  become: true
  tasks:
    - import_role:
        name: 'compile_kernel_pi4'
        tasks_from: 'main'

- name: 'Build Pi 5 kernel'
  hosts: 'pi5_kernel_builder'
  remote_user: '{{ ansible_user }}'
  become: true
  tasks:
    - import_role:
        name: 'compile_kernel_pi5'
        tasks_from: 'main'

- name: 'Deploy Pi 4 kernel'
  hosts: 'pi4_kernel'
  remote_user: '{{ ansible_user }}'
  become: true
  tasks:
    - import_role:
        name: 'compile_kernel_pi4'
        tasks_from: 'deploy'

- name: 'Deploy Pi 5 kernel'
  hosts: 'pi5_kernel'
  remote_user: '{{ ansible_user }}'
  become: true
  tasks:
    - import_role:
        name: 'compile_kernel_pi5'
        tasks_from: 'deploy'
