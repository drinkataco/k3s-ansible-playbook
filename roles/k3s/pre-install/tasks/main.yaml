---

- name: 'Install open-iscsi for Longhorn'
  ansible.builtin.apt:
    name: 'open-iscsi'
    state: 'present'
    update_cache: true

- name: 'Ensure iscsid service is enabled and running'
  ansible.builtin.service:
    name: 'iscsid'
    enabled: true
    state: 'started'

- name: 'Ensure /longhorn directory exists'
  ansible.builtin.file:
    path: '/longhorn'
    state: 'directory'
    mode: '0755'

- name: 'Check /opt/cni/bin state'
  ansible.builtin.stat:
    path: '/opt/cni/bin'
  register: cni_bin_stat

- name: 'Ensure /opt/cni parent directory exists'
  ansible.builtin.file:
    path: '/opt/cni'
    state: 'directory'
    mode: '0755'
  when: not cni_bin_stat.stat.exists

- name: 'Symlink /opt/cni/bin to Cilium CNI install path'
  ansible.builtin.file:
    src: '/usr/libexec/cni'
    dest: '/opt/cni/bin'
    state: link
    force: true
  when: not cni_bin_stat.stat.exists or cni_bin_stat.stat.islnk
