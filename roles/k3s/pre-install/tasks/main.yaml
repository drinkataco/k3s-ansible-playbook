---

- name: 'Install cluster node dependencies'
  ansible.builtin.apt:
    name:
      - 'nfs-common'
      - 'open-iscsi'
    state: 'present'
    update_cache: true

- name: 'Ensure iscsid service is enabled and running'
  ansible.builtin.service:
    name: 'iscsid'
    enabled: true
    state: 'started'

- name: 'Ensure /longhorn directory exists'
  ansible.builtin.file:
    path: '/longhorn'
    state: 'directory'
    mode: '0755'
