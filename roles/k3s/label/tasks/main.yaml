---

- name: 'Label Kubernetes nodes'
  when: inventory_hostname == groups['master'][0]
  ansible.builtin.shell:
    cmd: |
      kubectl label nodes {{ item.key }} {{ item.value.items() | map('join', '=') | join(' ') }} --overwrite
  loop: "{{ lookup('dict', labels | default({}, true)) }}"
  loop_control:
    label: '{{ item.key }}'

- name: 'Taint Kubernetes nodes'
  when: inventory_hostname == groups['master'][0]
  ansible.builtin.shell:
    cmd: "kubectl taint nodes {{ item.host }} {{ item.key }}{{ item.operator }}{{ item.value }}:{{ item.effect }} --overwrite"
  loop: "{{ taints | default([], true) }}"
